<svg xmlns="http://www.w3.org/2000/svg" width="900" height="592" viewBox="0 0 900 592" role="img" aria-labelledby="title desc">
  <title id="title">env-check: generate an environment template</title>
  <desc id="desc">Real CLI output from a public demo fixture. Safe defaults are retained and the demo token is stripped.</desc>
  <rect width="900" height="592" rx="14" fill="#0f172a"/>
  <path d="M14 0h872a14 14 0 0 1 14 14v32H0V14A14 14 0 0 1 14 0" fill="#1e293b"/>
  <circle cx="26" cy="23" r="6" fill="#fb7185"/>
  <circle cx="46" cy="23" r="6" fill="#fbbf24"/>
  <circle cx="66" cy="23" r="6" fill="#4ade80"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" xml:space="preserve">
  <text x="28" y="82" fill="#a5f3fc">$ node bin/env-check.js example -i docs/demo.env --stdout</text>
  <text x="28" y="105" fill="#e2e8f0"></text>
  <text x="28" y="128" fill="#94a3b8"># Environment variables schema and defaults</text>
  <text x="28" y="151" fill="#94a3b8"># Generated by env-check (https://github.com/YusufBeratZengin/env-check)</text>
  <text x="28" y="174" fill="#e2e8f0"></text>
  <text x="28" y="197" fill="#94a3b8"># Public demo data only; contains no credentials.</text>
  <text x="28" y="220" fill="#94a3b8"># @type port</text>
  <text x="28" y="243" fill="#94a3b8"># @required</text>
  <text x="28" y="266" fill="#e2e8f0">PORT=3000</text>
  <text x="28" y="289" fill="#e2e8f0"></text>
  <text x="28" y="312" fill="#94a3b8"># @type string</text>
  <text x="28" y="335" fill="#94a3b8"># @required</text>
  <text x="28" y="358" fill="#e2e8f0">NODE_ENV=development</text>
  <text x="28" y="381" fill="#e2e8f0"></text>
  <text x="28" y="404" fill="#94a3b8"># @type bool</text>
  <text x="28" y="427" fill="#94a3b8"># @required</text>
  <text x="28" y="450" fill="#e2e8f0">DEBUG=</text>
  <text x="28" y="473" fill="#e2e8f0"></text>
  <text x="28" y="496" fill="#94a3b8"># @type string</text>
  <text x="28" y="519" fill="#94a3b8"># @secret</text>
  <text x="28" y="542" fill="#94a3b8"># @required</text>
  <text x="28" y="565" fill="#e2e8f0">API_TOKEN=</text>
  </g>
</svg>
